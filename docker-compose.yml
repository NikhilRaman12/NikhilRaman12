services:
  api:
    build: .
    command: uvicorn medicobuddy.api:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment: [DEPLOYMENT_PROFILE=FULL_STACK, PGVECTOR_URL=postgresql://medico:medico@postgres:5432/medico, MILVUS_URI=http://milvus:19530, NEO4J_URI=bolt://neo4j:7687]
    ports: ["8000:8000"]
    depends_on: [postgres, milvus, neo4j]
    restart: unless-stopped
  ui:
    build: .
    command: streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port 7860
    environment: [API_URL=http://api:8000]
    ports: ["7860:7860"]
    depends_on: [api]
  postgres:
    image: pgvector/pgvector:pg16
    environment: [POSTGRES_USER=medico, POSTGRES_PASSWORD=medico, POSTGRES_DB=medico]
    volumes: [pgdata:/var/lib/postgresql/data]
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls=http://0.0.0.0:2379
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: minio server /data
    environment: [MINIO_ACCESS_KEY=minioadmin, MINIO_SECRET_KEY=minioadmin]
  milvus:
    image: milvusdb/milvus:v2.5.8
    command: [milvus, run, standalone]
    environment: [ETCD_ENDPOINTS=etcd:2379, MINIO_ADDRESS=minio:9000]
    depends_on: [etcd, minio]
  neo4j:
    image: neo4j:5.26-community
    environment: [NEO4J_AUTH=neo4j/change-me-in-env]
    volumes: [neo4jdata:/data]
volumes: {pgdata: {}, neo4jdata: {}}
